<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LausemausOS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.css">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js"}}
	</script>
</head>

<body>
  
  <!-- Top Bar -->
  <div class="top-bar" id="top">
    <p id="open" class="headertext_LausemausOS">LausemausOS</p>
    <p class="headertext">Possibilities are endless</p>
    <p id="Right" class="headertext"></p>
  </div>

  <!-- Desktop Apps / Icons -->
  <div id="notesIcon" class="desktop-apps Notes">
    <div class="app-icon">
      <img class="selected-img" src="Notes.png" alt="To-do" style="background-color: white;">
      <p class="app-text">To-do</p>
    </div>
  </div>

  <div id="weatherIcon" class="app-icon">
    <img class="selected-img" src="cloudy.png" alt="Weather" style="background-color: white;">
    <p class="app-text">Weather</p>
  </div>
  
  <div id="calculatorIcon" class="app-icon">
      <img class="selected-img" src="calculator.png" alt="Calculator" style="background-color: white;">
      <p class="app-text">Calculator</p>
  </div>

  <div id="mapIcon" class="app-icon">
      <img class="selected-img" src="map.png" alt="Map" style="background-color: white;">
      <p class="app-text">Map</p>
  </div>

  <!-- Welcome Window -->
  <div class="window" id="window">
    <div class="windowheader" id="drag">
      <div class="closebutton" id="close">X</div>
    </div>
    <div class="window-content">
      <p>Learn to draggy</p>
    </div>
  </div>  

  <!-- App Windows -->
  <div class="window" id="notes" style="display: none;">
    <div class="windowheader" id="notesheader">
      <div class="closebutton" id="notesclose">X</div>
    </div>

    <div class="window-content To__do__List">
      <h2>To-do's   &#128204 </h2>
      <div class="row">
        <input type="text" id="input_box" placeholder="Add your First To-Do!">
        <button class="add_item" onclick="addTask()">add</button>
      </div>
      <ul id="list_containter">
        <!--<li class="checked">Task 1</li>
        <li>Task 2</li>
        <li>Task 3</li>-->
      </ul>
    </div>
  </div>

  <div class="window" id="weather" style="display: none;">
      <div class="windowheader" id="weatherheader">
        <div class="closebutton" id="weatherclose">X</div>
      </div>

    <div class="window-content weather">
      <div class="search">
        <input id="location" type="text" placeholder="Type in any location!" spellcheck="false">
        <button class="add_item"><img class="search_icon" src="search.png" alt="magnifying glass Icon"></button>
      </div>

      <div class="error">
        <p>Invalid City name</p>
      </div>
      
      <div class="weather_display">
        <h1 class="city">New York</h1>
        <div class="class">
          <div class="basic_info">
            <img src="rain.png" class="weather_icon">
            <h2 class="temperature">22°C</h2>
          </div>
          <div class="details">
            <div class="humidity">
              <p>Humidity</p>
              <p class="humidity_text">50%</p>
            </div>
            <div class="wind">
              <p>Wind Speed</p>
              <p class="wind_text">2km/h</p>
            </div>
          </div>
          </div>
          
      </div>
    </div>
      
  </div>

  <div class="window" id="calculator" style="display: none;">
      <div class="windowheader" id="calculatorheader">
        <div class="closebutton" id="calculatorclose">X</div>
      </div>

    <div class="window-content calculator">
      <div class="calculator">
        <form>
          <div class="calc_display">
            <input type="text" name="show_numbers">
          </div>
          <div>
            <input type="button" value="AC" onclick="show_numbers.value = '' ">
            <input type="button" value="DE" onclick="show_numbers.value = show_numbers.value.toString().slice(0,-1)">
            <input type="button" value="." onclick="show_numbers.value += '.' ">
            <input type="button" value="/" onclick="show_numbers.value += '/' ">
          </div>

          <div>
            <input type="button" value="7" onclick="show_numbers.value += '7' ">
            <input type="button" value="8" onclick="show_numbers.value += '8' ">
            <input type="button" value="9" onclick="show_numbers.value += '9' ">
            <input type="button" value="*" onclick="show_numbers.value += '*' ">
          </div>

          <div>
            <input type="button" value="4" onclick="show_numbers.value += '4' ">
            <input type="button" value="5" onclick="show_numbers.value += '5' ">
            <input type="button" value="6" onclick="show_numbers.value += '6' ">
            <input type="button" value="-" onclick="show_numbers.value += '-' ">
          </div>

          <div>
            <input type="button" value="1" onclick="show_numbers.value += '1' ">
            <input type="button" value="2" onclick="show_numbers.value += '2' ">
            <input type="button" value="3" onclick="show_numbers.value += '3' ">
            <input type="button" value="+" onclick="show_numbers.value += '+' ">
          </div>

          <div>
            <input type="button" value="??">
            <input type="button" value="0" onclick="show_numbers.value = '0' ">
            <input type="button" value="="class="equal" onclick="show_numbers.value = eval(show_numbers.value)" >
          </div>

        </form>
      </div>
    </div>
  </div>

  <div class="window" id="map" style="display: none;">
    <div class="windowheader" id="mapheader">
      <div class="closebutton" id="mapclose">X</div>
    </div>

    <div class="window-content Map" id="map-content">
      <div id="map" style="width: 100%; height: 100%;"></div>
    </div>
    <script src="map.js" type="module"></script>
  </div>

  <script src="main.js" defer></script>

</body>
</html>
